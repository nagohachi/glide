# Composed Speech-LLM SFT: pick an encoder + projector + text LLM independently.
#   glide sft configs/examples/composed_speech_llm_sft.yaml
# data_root.yaml (gitignored; copy from data_root.example.yaml) maps corpus -> root.
extends: [../data_root.yaml, ../base.yaml]

task: sft
modality: speech

model:
  name: meta-llama/Llama-3.2-1B          # text LLM: Qwen3-1.7B | Llama-3.2-1B/3B | google/gemma-3-1b-it | ...
  attn_implementation: sdpa
  torch_dtype: bfloat16

special_tokens:
  audio_token: "<audio>"                  # required: the marker spliced with audio embeds
  additional: ["<audio>"]

data:
  corpus: csj                     # selects data_roots[corpus] from data_root.yaml
  train: native_sft/train.jsonl       # relative to the corpus root
  eval: native_sft/dev.jsonl
  audio_field: audio
  response_field: text
  reference_field: text

speech:
  enabled: true
  task: recognition
  sample_rate: 16000
  encoder:
    name: whisper                         # whisper | wavlm | xls_r | qwen3_asr_aut | qwen_omni_aut
    pretrained: openai/whisper-large-v3   # or small/medium/large/large-v2/large-v3
    freeze: true                          # projector warm-up: freeze the encoder
  projector:
    name: mlp_gelu                        # mlp_gelu (scratch) | qwen3_asr_proj | qwen_omni_proj
    num_layers: 2
    downsample: 5                         # stack 5 frames -> 5x shorter audio sequence
  specaugment:
    enabled: true
    num_freq_mask: 2
    num_time_mask: 5
  speed_perturb:
    enabled: true
    from_field: true                      # use each record's "speed" (CSJ native_sft style)
    factors: [0.9, 1.0, 1.1]
  warmup:                                 # projector-only warmup -> full fine-tuning
    projector_only_steps: 1000            # phase 1: train ONLY the projector
    projector_lr: 1.0e-4                  # phase-1 projector LR
    full_warmup_steps: 1000              # phase-2 LR warmup length (steps)
    # projector_patterns defaults cover both the composed projector and Qwen3-ASR's
    # audio_tower.proj1/proj2 -- override if your projector lives elsewhere.

template:
  system_prompt: ""
  train_on_completions_only: true   # composed collator masks the chat-template prompt
                                    # prefix automatically (no response_template needed)

training:
  output_dir: outputs/composed_speech_llm
  per_device_train_batch_size: 4
  learning_rate: 1.0e-4                    # higher LR for from-scratch projector warm-up
  num_train_epochs: 3
